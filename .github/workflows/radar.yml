name: Radar UGC

on:
  schedule:
    - cron: "17 */2 * * *"   # a cada 2 h (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:
    inputs:
      modo:
        description: "normal = radar de sempre; amplo = coleta ampla para calibração (sem alertas)"
        default: normal
        type: choice
        options: [normal, amplo]
      ate:
        description: "Só no modo amplo: coletar até este horário UTC (ex.: 2026-10-17T21:00Z)"
        default: ""
        type: string
      intervalo_min:
        description: "Só no modo amplo: minutos entre rodadas"
        default: "10"
        type: string

permissions:
  contents: write

jobs:
  radar:
    if: ${{ inputs.modo != 'amplo' }}
    concurrency:
      group: radar
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # ponta atual da branch, não o commit do disparo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Atualizar para o último estado salvo
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Testes (dados falsos, sem internet)
        id: tests
        run: python -m unittest discover -s tests -q

      - name: Coleta, histórico, análise e site
        run: python radar.py run

      - name: Commit do histórico, do site e do estado dos alertas
        if: always() && steps.tests.outcome != 'failure'
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data.json
          [ -f docs/carteira.json ] && git add docs/carteira.json
          if git diff --cached --quiet; then
            echo "Nada novo para salvar."
            exit 0
          fi
          git commit -m "radar: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}"; then
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            else
              git rebase --abort || true
            fi
            sleep $((2 ** i))
          done
          echo "::error::Não consegui salvar o commit; alertas desta execução NÃO foram enviados."
          exit 1

      - name: Enviar alertas (só depois do commit salvo)
        run: python radar.py send

      - name: Avisar falha pelo ntfy
        if: failure()
        run: python radar.py notice "O workflow do radar falhou. Veja a aba Actions do repositório."

  amplo:
    # Coleta ampla: rodadas até o horário pedido, commit a cada rodada, calibração no fim. Nunca manda alerta.
    if: ${{ inputs.modo == 'amplo' }}
    concurrency:
      group: radar-amplo-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes (dados falsos, sem internet)
        run: python -m unittest discover -s tests -q

      - name: Rodadas de coleta ampla
        env:
          ATE: ${{ inputs.ate }}
          INTERVALO_MIN: ${{ inputs.intervalo_min }}
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fim=$(date -u -d "${ATE:-+90 minutes}" +%s 2>/dev/null || date -u -d "+90 minutes" +%s)
          limite=$(( $(date -u +%s) + 330*60 ))
          if [ "$fim" -gt "$limite" ]; then fim=$limite; fi
          intervalo=$(( ${INTERVALO_MIN:-10} * 60 ))
          salvar() {
            for f in data/amplo data/calibracao.md data/calibracao.json; do if [ -e "$f" ]; then git add "$f"; fi; done
            git diff --cached --quiet && return 0
            git commit -q -m "amplo: $1 $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4; do
              if git pull -q --rebase origin "${GITHUB_REF_NAME}"; then
                git push -q origin "HEAD:${GITHUB_REF_NAME}" && return 0
              else
                git rebase --abort || true
              fi
              sleep $((2 ** i))
            done
            echo "::warning::Não consegui salvar a rodada; sigo coletando."
          }
          while [ "$(date -u +%s)" -lt "$fim" ]; do
            inicio=$(date -u +%s)
            git pull -q --rebase origin "${GITHUB_REF_NAME}" || true   # pega código novo entre rodadas
            python radar.py amplo || echo "::warning::rodada falhou"
            python radar.py calibrar || echo "::warning::calibração falhou"
            salvar rodada
            espera=$(( intervalo - ($(date -u +%s) - inicio) ))
            agora=$(date -u +%s)
            if [ $(( agora + espera )) -ge "$fim" ]; then break; fi
            if [ "$espera" -gt 0 ]; then sleep "$espera"; fi
          done
          git pull -q --rebase origin "${GITHUB_REF_NAME}" || true
          python radar.py calibrar
          salvar calibracao
